<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dilan – Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Noto+Sans+Math&family=Outfit:wght@800&family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060F;--ink:#F2F3F7;--muted:#8C90A0;--line:#1E2440;--red:#FF2E93;--amber:#00E5FF;--panel:#0A0C1C;
  --display:"Space Grotesk","Noto Sans Math","Arial Narrow",system-ui,sans-serif;--body:"Inter","Noto Sans Math",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{background:var(--bg);color:var(--ink);font:400 1.02rem/1.65 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
main,footer{position:relative;z-index:1}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.metal{background:linear-gradient(180deg,#fff 25%,#7C8094 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font:700 clamp(2rem,6vw,4rem)/1 var(--display);letter-spacing:-.03em;margin-bottom:40px}
section.block{padding:110px 0;border-top:1px solid var(--line)}

/* intro overlay */
#intro{position:fixed;inset:0;z-index:50;background:#05060F;display:grid;place-items:center;transition:opacity .8s}
#intro.done{opacity:0;pointer-events:none}
#intro .dot{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;animation:dot 1.1s ease forwards}
@keyframes dot{0%{transform:scale(0)}40%{transform:scale(1)}100%{transform:scale(0) translateY(-40px)}}
#intro .nm{font:400 clamp(3rem,17vw,11rem)/1 "Noto Sans Math","Cambria Math","Segoe UI Symbol",var(--display);white-space:nowrap;letter-spacing:-.02em;opacity:0;animation:nm 1.4s .9s ease forwards}
@keyframes nm{0%{opacity:0;letter-spacing:.2em}40%{opacity:1}100%{opacity:1;letter-spacing:-.03em}}

/* nav */
header{position:fixed;top:0;left:0;right:0;z-index:20;background:rgba(5,6,15,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;justify-content:space-between;align-items:center;height:56px}
.logo{font:800 1.4rem "Outfit",var(--display);text-decoration:none;text-transform:uppercase;letter-spacing:.02em}
nav{display:flex;gap:22px}
nav a{text-decoration:none;text-transform:uppercase;letter-spacing:.06em;font-size:.72rem;color:var(--muted);font-weight:500}
nav a.on,nav a:hover{color:var(--red)}
nav a.on{box-shadow:0 2px 0 var(--red)}
#prog{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--red)}

#sfx{background:none;border:1px solid var(--line);color:var(--muted);font:600 .75rem var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
#sfx:hover{color:var(--ink)}

/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(5,6,15,.8) 0%,transparent 45%)}
/* photo slots (profile, about, projects) */
.pslot{position:relative}
.pclip{position:absolute;inset:0;overflow:hidden;display:grid;place-items:center;border-radius:inherit}
.pclip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph{color:var(--muted);text-align:center;font:700 3rem var(--display);line-height:1.3}
.ph small{display:block;font:500 .8rem var(--body)}
.has .ph{display:none}
.padd{position:absolute;right:10px;bottom:10px;z-index:3;background:rgba(5,6,15,.85);color:var(--ink);border:1px solid var(--line);font:600 .72rem var(--body);padding:6px 12px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px)}
.padd:hover{border-color:var(--red);color:var(--red)}
.prm{display:none;position:absolute;left:10px;bottom:10px;z-index:3;width:28px;height:28px;border-radius:50%;background:rgba(5,6,15,.85);color:var(--ink);border:1px solid var(--line);cursor:pointer}
.editing .has .prm{display:block}
.avatar{position:absolute;right:7%;top:15%;width:clamp(170px,32vw,360px);aspect-ratio:1;border-radius:50%;z-index:2;filter:drop-shadow(0 0 36px rgba(0,229,255,.28))}
.avatar::before{content:"";position:absolute;inset:-7px;border-radius:50%;z-index:-1;background:conic-gradient(from 0deg,var(--red),var(--amber),var(--red));animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.avatar .pclip{border:4px solid #05060F;background:radial-gradient(circle at 30% 25%,#1a1f3d,#0a0c1c 70%)}
.avatar .ph{font-size:clamp(3rem,10vw,6rem);color:var(--ink)}
.avatar .padd{right:0;bottom:8%}
.aboutpic{aspect-ratio:4/5;max-width:340px;border-radius:18px;margin-top:28px}
.aboutpic .pclip{border:1px dashed var(--line);background:var(--panel)}
.aboutpic.has .pclip{border-style:solid}
.hero .wrap{width:100%;padding-bottom:56px}
.hero h1{font:700 clamp(3rem,14.5vw,13rem)/.9 var(--display);letter-spacing:-.05em}
.role{font:500 clamp(1rem,2.4vw,1.4rem);color:var(--muted);margin:10px 0 0 6px}
.role b{color:var(--ink);font-weight:700}
.role .serif{color:var(--ink);font-size:1.2em}
.serif{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400}
#edbar{position:fixed;right:14px;justify-content:flex-end;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 28px)}
#ed-tools{display:flex;gap:8px;flex-wrap:wrap}#ed-tools[hidden]{display:none}
#edbar button{background:rgba(5,6,15,.88);border:1px solid var(--line);color:var(--ink);font:600 .75rem var(--body);padding:8px 14px;border-radius:999px;cursor:pointer;backdrop-filter:blur(8px)}
#edbar button:hover,#edbar button.on{border-color:var(--red);color:var(--red)}
.editing [data-e]{outline:1px dashed var(--amber);outline-offset:3px;cursor:text;caret-color:var(--red)}
.editing [data-e]:focus{outline:2px solid var(--red)}
.eyebrow{font:500 .72rem var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}

/* about */
.about{display:grid;grid-template-columns:1fr 1.2fr;gap:48px;align-items:start}
.about h2{margin:0}
.about p{color:var(--muted);max-width:56ch}
.about p+p{margin-top:16px}
.panel{background:rgba(10,12,28,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:26px}

/* services */
#skills h2{text-align:right}
.svc{display:grid;grid-template-columns:70px 1fr auto;gap:4px 20px;align-items:baseline;padding:24px 14px;border-top:1px solid var(--line);transition:background .25s}
.svc:hover{background:rgba(255,255,255,.04)}
.svc p{grid-column:2}
.svc .ar{grid-column:3;grid-row:1;color:var(--red);font-size:1.3rem;transition:transform .25s}
.svc:hover .ar{transform:translate(4px,4px)}
.svc:last-child{border-bottom:1px solid var(--line)}
.svc i{font:500 .9rem var(--display);font-style:normal;color:var(--red)}
.svc h3{font:700 clamp(1.2rem,2.6vw,1.7rem) var(--display);letter-spacing:-.01em;text-transform:uppercase}
.svc p{color:var(--muted);font-size:.98rem}
.svc:hover h3{color:var(--red)}

/* projects */
.proj{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;padding:36px 0;border-top:1px solid var(--line)}
.proj:nth-child(even) .shot{order:2}
.shot{aspect-ratio:16/10;border-radius:12px}
.shot .pclip{border:1px solid var(--line);background:radial-gradient(circle at 30% 20%,hsl(var(--c) 60% 30%),#0A0A10 70%)}
.shot .ph{color:var(--ink)}
.proj h3{font:700 clamp(1.7rem,4vw,2.6rem)/1 var(--display);letter-spacing:-.03em;margin-bottom:14px;text-transform:uppercase;text-shadow:1px 1px 0 #666,2px 2px 0 #444,3px 3px 0 #222}
.proj h3 .serif{display:block;text-transform:none;font-size:1.15em;letter-spacing:0}
.proj p{color:var(--muted);margin-bottom:16px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.tags span{font-size:.8rem;padding:3px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.links{display:flex;gap:20px;font-weight:600}
.links a{color:var(--amber)}

/* dot matrix */
.led{text-align:center}
.led h2{font-size:clamp(1.2rem,3vw,1.8rem);margin-bottom:24px}
#dots{width:100%;max-width:900px;height:auto;aspect-ratio:900/360;background:var(--panel);border:1px solid var(--line);border-radius:14px;touch-action:none}
.led small{display:block;margin-top:14px;color:var(--muted)}

/* contact */
.contact{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center}
.contact h2{font-size:clamp(2.4rem,8vw,5.5rem);margin-bottom:22px}
.contact em{color:var(--amber);font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400}
.contact p{color:var(--muted);max-width:46ch;margin-bottom:26px}
.btn{display:inline-block;padding:12px 26px;border-radius:999px;font-weight:600;text-decoration:none;background:var(--red);color:#05060F;margin-right:10px}
.btn.o{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn:hover{filter:brightness(1.15)}
.card dl{display:grid;gap:18px}
.card dt{font-size:.8rem;color:var(--muted)}
.card dd a{text-decoration:none}
.card dd a:hover{color:var(--amber)}
.crow.empty{display:none}.editing .crow.empty{display:block}
.muted{color:var(--muted)}
.soc{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.soc .btn{margin:0}
.cin{background:var(--panel);border:1px solid var(--red);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;width:62%;max-width:100%}
.csave{background:var(--red);color:#05060F;border:0;border-radius:999px;padding:5px 14px;font-weight:600;cursor:pointer;margin-left:6px}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:999px;z-index:60;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .3s;max-width:90%;text-align:center}
#toast.on{opacity:1}
.cedit{display:none;background:none;border:1px solid var(--line);color:var(--amber);border-radius:999px;padding:0 9px;cursor:pointer;margin-left:6px}
.editing .cedit{display:inline-block}
footer{padding:28px 0;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}

@media (max-width:760px){
  nav{display:none}
  .about,.proj,.contact{grid-template-columns:1fr}
  .svc{grid-template-columns:44px 1fr auto}
  .proj:nth-child(even) .shot{order:0}
  .avatar{right:6%;top:13%;width:clamp(130px,42vw,200px)}
  section.block{padding:76px 0}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}#intro{display:none}.avatar::before{animation:none}}

/* ===== opening animation: Creator -> DILAN -> @handle ===== */
#intro .ibox{display:grid;justify-items:center;gap:14px;text-align:center}
.i1,.i3{font:600 clamp(.85rem,3vw,1.2rem)/1.2 "Noto Sans Math","Cambria Math",var(--body);letter-spacing:.32em;color:var(--muted);opacity:0;animation:up .8s ease forwards}
.i1{animation-delay:.9s}
.i3{animation-delay:2.6s;color:var(--amber);letter-spacing:.2em}
#intro .nm{animation:nmIn 1.1s 1.6s cubic-bezier(.2,.8,.2,1) forwards;letter-spacing:-.01em}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes nmIn{from{opacity:0;transform:scale(.7);filter:blur(16px)}to{opacity:1;transform:none;filter:blur(0)}}
.role2{font:400 clamp(1.4rem,4vw,2.2rem)/1.2 "Noto Sans Math","Cambria Math",var(--display);margin:8px 0 0 6px}
.role2:empty{display:none}

/* ===== add / delete buttons (edit mode) ===== */
.svc,.proj{position:relative}
.addbtn{display:none;margin:22px auto 0;padding:12px 26px;color:var(--ink);font:600 .9rem var(--body);cursor:pointer}
.editing .addbtn{display:flex}
.del{display:none;position:absolute;top:12px;right:14px;z-index:3;min-width:30px;height:30px;padding:0 10px;color:var(--ink);font:600 .75rem var(--body);cursor:pointer}
.editing .del{display:block}

/* ===== iOS liquid glass ===== */
:root{--glass:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.05));--gb:1px solid rgba(255,255,255,.2);--gs:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.06),0 14px 44px rgba(0,0,0,.4);--blur:blur(24px) saturate(180%)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(42vmax 42vmax at 12% 18%,rgba(255,46,147,.26),transparent 62%),radial-gradient(46vmax 46vmax at 88% 72%,rgba(0,229,255,.22),transparent 62%),radial-gradient(34vmax 34vmax at 55% 105%,rgba(130,80,255,.2),transparent 60%)}
header,.panel,.svc,.proj,.btn.o,#edbar button,.padd,.prm,.del,.addbtn,#toast,#sfx,#dots{background:var(--glass);border:var(--gb);box-shadow:var(--gs);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.tags span,.cedit,.cin{background:rgba(255,255,255,.08);border:var(--gb)}
.btn{background:linear-gradient(135deg,rgba(255,46,147,.95),rgba(255,46,147,.62));color:#fff;border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 10px 28px rgba(255,46,147,.35);transition:transform .25s cubic-bezier(.34,1.56,.64,1),filter .2s}
.btn.o{color:var(--ink)}
button:active,.btn:active{transform:scale(.96)}
header{top:10px;left:10px;right:10px;border-radius:24px;overflow:hidden}
header .wrap{padding:0 18px}
html{scroll-padding-top:84px}
#prog{bottom:0}
nav a{padding:6px 12px;border-radius:999px;transition:background .25s,color .25s}
nav a:hover{background:rgba(255,255,255,.1)}
nav a.on{box-shadow:none;background:rgba(255,255,255,.16);color:#fff}
.panel,.card{border-radius:26px}
.svc{border-radius:22px;margin-bottom:12px;padding:20px 24px;transition:transform .3s cubic-bezier(.34,1.56,.64,1),filter .3s}
.svc:hover{filter:brightness(1.15);transform:translateY(-2px)}
.proj{border-radius:30px;padding:24px;margin-bottom:22px}
.shot .pclip,.aboutpic .pclip{border-radius:18px}
.shot{aspect-ratio:16/9}
#dots{border-radius:26px}
header{background:linear-gradient(135deg,rgba(14,16,34,.66),rgba(14,16,34,.42))}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div id="toast" role="status"></div>
<div id="edbar"><button id="ed-toggle" type="button">✎ Edit</button><span id="ed-tools" hidden><button id="ed-reset" type="button">Reset all</button></span></div><input type="file" id="ed-file" accept="image/*" hidden>
<div id="intro" aria-hidden="true"><span class="dot"></span><div class="ibox"><div class="i1" id="intro-top"></div><div class="nm metal" id="intro-name"></div><div class="i3" id="intro-handle"></div></div></div>

<header><div class="wrap">
  <a class="logo" href="#home" id="logo"></a>
  <nav id="nav"><a href="#home">Home</a><a href="#about">About</a><a href="#skills">Skills</a><a href="#projects">Projects</a><a href="#play">Play</a><a href="#contact">Contact</a></nav>
  <button id="sfx" type="button" aria-label="Turn sound on or off">SFX ON</button>
</div><div id="prog"></div></header>

<main>
  <section class="hero" id="home">
    <div class="pslot avatar" data-slot="profile"><div class="pclip"><span class="ph"></span></div></div>
    <div class="wrap">
      <h1 class="metal" id="h1">Portfolio</h1>
      <p class="role" id="role"></p>
      <p class="role2 metal" id="role2"></p>
    </div>
  </section>

  <section class="block" id="about"><div class="wrap about">
    <div><h2 class="metal" id="about-h"></h2><div class="pslot aboutpic" data-slot="about"><div class="pclip"><span class="ph">📷<small>Add your photo</small></span></div></div></div>
    <div class="panel" id="about-text"></div>
  </div></section>

  <section class="block" id="skills"><div class="wrap">
    <h2 class="metal" id="skills-h"></h2><div id="svc"></div><button type="button" class="addbtn" id="add-skill">＋ Add skill</button>
  </div></section>

  <section class="block" id="projects"><div class="wrap">
    <p class="eyebrow">Creative work</p><h2 class="metal">My projects</h2><div id="projs"></div><button type="button" class="addbtn" id="add-proj">＋ Add project</button>
  </div></section>

  <section class="block led" id="play"><div class="wrap">
    <h2>Break it if you can</h2>
    <canvas id="dots" width="900" height="360" aria-label="Interactive dot text"></canvas>
    <small>Move your mouse or finger over the dots.</small>
  </div></section>

  <section class="block" id="contact"><div class="wrap contact">
    <div>
      <h2 class="metal" id="c-title"></h2>
      <p id="c-text"></p>
      <a class="btn" id="c-mail" hidden>Email me</a><a class="btn" id="c-wa" target="_blank" rel="noopener" hidden>WhatsApp</a><a class="btn o" id="c-cv" hidden>Resume</a>
      <div class="soc" id="c-soc"></div>
    </div>
    <div class="panel card"><dl id="c-list"></dl></div>
  </div></section>
</main>

const rw = SITE.role.split(" "), r0 = rw.shift(); $("role").innerHTML = `<b>${esc(r0)}</b>` + (rw.length ? ` <span class="serif">${esc(rw.join(" "))}</span>` : "");
$("about-h").textContent = SITE.aboutTitle; $("skills-h").textContent = SITE.skillsTitle;
$("h1").textContent = SITE.hero;
$("footer").textContent = "© " + new Date().getFullYear() + " " + SITE.name;
SITE.about.forEach((t, i) => { const p = el("p", "", esc(t)); p.style.color = "var(--ink)"; if (i === 0) p.style.fontSize = "1.35rem"; $("about-text").appendChild(p); });

/* edit mode + photo slots + contact. Saved in this browser (localStorage). */
const EK = "portfolio-edits-v1";
let ED = {}; try { ED = JSON.parse(localStorage.getItem(EK)) || {}; } catch (e) {}
let tt; const toast = m => { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 3500); };
const persist = () => { try { localStorage.setItem(EK, JSON.stringify(ED)); } catch (e) { toast("Saving is blocked here, so changes stay only until you refresh."); } };

let SV = ED.services || SITE.services.map(x => ({ ...x }));
let PJ = ED.projects || SITE.projects.map((x, i) => ({ ...x, id: "p" + i, tags: [...(x.tags || [])] }));

const EL = [...document.querySelectorAll("#logo,#h1,#role b,#role span,#role2,h2:not(#c-title),#about-text p,#c-title span,#c-title em,#c-text")];
EL.forEach((e, i) => {

  e.addEventListener("input", () => { (ED.t = ED.t || {})[k] = e.textContent; persist(); });
  e.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); e.blur(); } });
});
const setCE = (e, v) => { if (!v) return e.removeAttribute("contenteditable"); try { e.contentEditable = "plaintext-only"; } catch (x) { e.contentEditable = "true"; } };
let editing = false;
const setEdit = v => {

$("ed-toggle").onclick = () => setEdit(!editing);
$("logo").addEventListener("click", ev => { if (editing) ev.preventDefault(); });

/* photo slots: profile (home), about, every project */
const SLOTS = {}; let pickId = null;
const initSlot = (box, staticSrc) => {
  const id = box.dataset.slot, clip = box.querySelector(".pclip");
  const add = el("button", "padd", ""), rm = el("button", "prm", "✕");
  add.type = rm.type = "button"; rm.setAttribute("aria-label", "Remove photo"); box.append(add, rm);
  const set = (u, fx) => {
    let im = clip.querySelector("img");
    if (!u) { if (im) im.remove(); box.classList.remove("has"); add.textContent = "📷 Add photo"; return; }
    if (!im) { im = new Image(); im.alt = ""; clip.prepend(im); }
    im.src = u; im.style.objectPosition = ((fx ?? .5) * 100) + "% 30%"; box.classList.add("has"); add.textContent = "📷 Change";
  };
  const cur = (ED.img || {})[id]; set(cur ? cur.u : staticSrc, cur && cur.fx);
  add.onclick = () => { pickId = id; $("ed-file").click(); };
  clip.onclick = () => { if (!box.classList.contains("has")) add.click(); };
  rm.onclick = () => { if (ED.img) delete ED.img[id]; persist(); set(staticSrc); };
  SLOTS[id] = set;
};
document.querySelectorAll(".pslot").forEach(b => initSlot(b, b.dataset.slot === "profile" ? SITE.photo : SITE.aboutPhoto));
document.querySelector('[data-slot="profile"] .ph').textContent = (SITE.name || "D").trim()[0].toUpperCase();
$("ed-file").onchange = e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f || !pickId) return;
  const id = pickId, rd = new FileReader();
  rd.onload = () => {
    const im = new Image(); im.onload = () => {
      const k = Math.min(1, 800 / Math.max(im.width, im.height)), c = document.createElement("canvas");
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      const qw = 100, qh = Math.max(1, Math.round(100 * c.height / c.width)), q = document.createElement("canvas"); q.width = qw; q.height = qh;
      const qg = q.getContext("2d"); qg.drawImage(c, 0, 0, qw, qh);
      const qd = qg.getImageData(0, 0, qw, qh).data, col = new Array(qw).fill(0);
      for (let j = 0; j < qh; j++) for (let i = 0; i < qw; i++) { const n = (j * qw + i) * 4, l = (qd[n] + qd[n + 1] + qd[n + 2]) / 765; col[i] += l * l; }
      const win = Math.min(qw, qh); let best = 0, bs = -1;
      for (let i = 0; i + win <= qw; i++) { let t = 0; for (let k2 = i; k2 < i + win; k2++) t += col[k2]; if (t > bs) { bs = t; best = i; } }
      const fx = (best + win / 2) / qw;
      (ED.img = ED.img || {})[id] = { u: c.toDataURL("image/jpeg", .82), fx }; persist(); SLOTS[id](ED.img[id].u, fx);
    }; im.src = rd.result;
  }; rd.readAsDataURL(f);
};

/* contact details: Edit > ✎ to add name, email, WhatsApp, Instagram, TikTok, Facebook, GitHub, location */
const clean = v => encodeURIComponent(String(v).trim().replace(/^@/, ""));
const isUrl = v => /^https?:\/\//i.test(v);
const lastSeg = v => { try { const u = new URL(v); return u.pathname.split("/").filter(Boolean).pop() || u.hostname; } catch (e) { return v; } };
const at = v => "@" + (isUrl(v) ? lastSeg(v) : v.trim()).replace(/^@/, "");
const CT = [
  { k: "name", label: "Name", prompt: "Your name" },
  { k: "email", label: "Email", prompt: "Your email address", link: v => "mailto:" + v.trim() },
  { k: "whatsapp", label: "WhatsApp", prompt: "Number with country code, e.g. 94771234567", link: v => "https://wa.me/" + v.replace(/\D/g, ""), show: v => "+" + v.replace(/\D/g, "") },
  { k: "instagram", label: "Instagram", prompt: "Username or full link", link: v => "https://instagram.com/" + clean(v), show: at, soc: 1 },
  { k: "tiktok", label: "TikTok", prompt: "Username or full link", link: v => "https://www.tiktok.com/@" + clean(v), show: at, soc: 1 },
  { k: "facebook", label: "Facebook", prompt: "Username or full profile link", link: v => "https://facebook.com/" + clean(v), show: v => isUrl(v) ? (lastSeg(v) === "profile.php" ? "Facebook profile" : lastSeg(v)) : v.trim(), soc: 1 },
  { k: "github", label: "GitHub", prompt: "Username or full link", link: v => "https://github.com/" + clean(v), show: at, soc: 1 },
  { k: "location", label: "Location", prompt: "Your city, country" }
];
const CV = { ...SITE.contact, ...(ED.contact || {}) };
const urlOf = (c, v) => isUrl(v) ? v : c.link ? c.link(v) : "";
const renderContact = () => {
  $("c-list").innerHTML = CT.map(c => {
    const v = (CV[c.k] || "").trim(), u = v ? urlOf(c, v) : "", shown = v ? (c.show ? c.show(v) : v) : "";
    const val = !v ? '<span class="muted">+ add</span>' : u ? `<a href="${esc(u)}"${c.k === "email" ? "" : ' target="_blank" rel="noopener"'}>${esc(shown)}</a>` : esc(shown);
    return `<div class="crow${v ? "" : " empty"}"><dt>${c.label}</dt><dd>${val} <button type="button" class="cedit" data-k="${c.k}" aria-label="Edit ${c.label}">✎</button></dd></div>`;
  }).join("");
  const em = (CV.email || "").trim(), wa = (CV.whatsapp || "").replace(/\D/g, "");
  $("c-mail").hidden = !em; if (em) $("c-mail").href = "mailto:" + em;
  $("c-wa").hidden = !wa; if (wa) $("c-wa").href = "https://wa.me/" + wa;
  $("c-soc").innerHTML = CT.filter(c => c.soc && (CV[c.k] || "").trim()).map(c => `<a class="btn o" href="${esc(urlOf(c, CV[c.k].trim()))}" target="_blank" rel="noopener">${c.label}</a>`).join("");
};
$("c-list").addEventListener("click", e => {
  const b = e.target.closest(".cedit");
  if (b) {
    const c = CT.find(x => x.k === b.dataset.k), dd = b.closest("dd");
    dd.innerHTML = `<input class="cin" aria-label="${c.label}" placeholder="${esc(c.prompt)}" value="${esc(CV[c.k] || "")}"><button type="button" class="csave" data-s="${c.k}">Save</button>`;
    const inp = dd.querySelector("input"); inp.focus();
    inp.addEventListener("keydown", ev => { if (ev.key === "Enter") dd.querySelector(".csave").click(); if (ev.key === "Escape") renderContact(); });
    return;
  }
  const sv = e.target.closest(".csave");
  if (sv) { const k = sv.dataset.s; CV[k] = sv.closest("dd").querySelector("input").value.trim(); (ED.contact = ED.contact || {})[k] = CV[k]; persist(); renderContact(); }
});
renderContact();

/* skills + projects: add / edit / delete (edit mode) */
const pad = n => String(n).padStart(2, "0");
const saveLists = () => { ED.services = SV; ED.projects = PJ; persist(); };
const fmtTitle = t => { const w = String(t).trim().split(/\s+/), last = w.pop() || ""; return (w.length ? `<span>${esc(w.join(" "))}</span> ` : "") + `<span class="serif">${esc(last)}</span>`; };
const arm = (btn, fn) => { if (btn.dataset.armed) return fn(); btn.dataset.armed = 1; const o = btn.textContent; btn.textContent = "Sure?"; setTimeout(() => { delete btn.dataset.armed; btn.textContent = o; }, 2500); };
const wire = (root, list) => root.querySelectorAll("[data-f]").forEach(e => {
  const it = () => list()[+e.closest("[data-i]").dataset.i];
  setCE(e, editing);
  e.addEventListener("input", () => { it()[e.dataset.f] = e.textContent; saveLists(); });
  e.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); e.blur(); } });
  if (e.dataset.f === "title" && e.tagName === "H3" && e.closest(".proj")) e.addEventListener("blur", () => { e.innerHTML = fmtTitle(it().title); });
});
const renderSkills = () => {
  const box = $("svc"); box.innerHTML = "";
  SV.forEach((s, i) => {
    const d = el("div", "svc", `<i>${pad(i + 1)}</i><h3 data-f="title">${esc(s.title)}</h3><span class="ar" aria-hidden="true">↘</span><p data-f="text">${esc(s.text)}</p><button type="button" class="del" aria-label="Delete skill">✕</button>`);
    d.dataset.i = i; d.querySelector(".del").onclick = ev => arm(ev.currentTarget, () => { SV.splice(i, 1); saveLists(); renderSkills(); });
    box.appendChild(d);
  });
  wire(box, () => SV);
};
const renderProjects = () => {
  const box = $("projs"); box.innerHTML = "";
  PJ.forEach((p, i) => {
    const links = (p.live ? `<a href="${esc(p.live)}" target="_blank" rel="noopener">Live site</a>` : "") + (p.code ? `<a href="${esc(p.code)}" target="_blank" rel="noopener">Source code</a>` : "");
    const d = el("article", "proj", `<div class="pslot shot" data-slot="${esc(p.id)}" style="--c:${(i * 60 + 340) % 360}"><div class="pclip"><span class="ph">${esc((p.title || "?").slice(0, 2))}</span></div></div><div><p class="eyebrow">${pad(i + 1)} / <span data-f="kind">${esc(p.kind || "")}</span></p><h3 data-f="title">${fmtTitle(p.title)}</h3><p data-f="text">${esc(p.text)}</p><div class="tags">${(p.tags || []).map(t => `<span>${esc(t)}</span>`).join("")}</div><div class="links">${links}</div><button type="button" class="del" aria-label="Delete project">✕</button></div>`);
    d.dataset.i = i; box.appendChild(d); initSlot(d.querySelector(".pslot"), p.image || "");
    d.querySelector(".del").onclick = ev => arm(ev.currentTarget, () => { if (ED.img) delete ED.img[p.id]; PJ.splice(i, 1); saveLists(); renderProjects(); });
  });
  wire(box, () => PJ);
};
const focusNew = box => { const n = box.lastElementChild; n.scrollIntoView({ block: "center", behavior: "smooth" }); const h = n.querySelector("h3"); h.focus(); getSelection().selectAllChildren(h); };
$("add-skill").onclick = () => { SV.push({ title: "New skill", text: "Write something about it." }); saveLists(); renderSkills(); focusNew($("svc")); };
$("add-proj").onclick = () => { PJ.push({ id: "n" + Date.now().toString(36), title: "New Project", text: "Describe your project here.", kind: "Category", tags: [], live: "", code: "", image: "" }); saveLists(); renderProjects(); focusNew($("projs")); };
renderSkills(); renderProjects();

/* intro overlay */
setTimeout(() => $("intro").classList.add("done"), still ? 0 : 4600);

/* sound effects (WebAudio, no files needed). Browser rule: first click/tap-ku appuram dhaan sound varum */
let ac = null, sfx = true;
const beep = (f = 660, d = .08, type = "square") => {
  if (!sfx || !ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.05, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
};
addEventListener("pointerdown", () => { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } }, { once: true });
$("sfx").onclick = () => { sfx = !sfx; $("sfx").textContent = sfx ? "SFX ON" : "SFX OFF"; };
document.addEventListener("click", e => { if (e.target.closest("a,#sfx")) beep(520, .06); });

/* nav: scroll progress + active link */
const links = [...document.querySelectorAll("#nav a")];
addEventListener("scroll", () => {
  const h = document.documentElement;
  $("prog").style.width = (h.scrollTop / (h.scrollHeight - h.clientHeight) * 100) + "%";
}, { passive: true });
const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) {
    links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
    if (window.lastSec && window.lastSec !== e.target.id) { beep(440, .1); setTimeout(() => beep(660, .12), 110); }
    window.lastSec = e.target.id;
  }
}), { rootMargin: "-45% 0px -50% 0px" });
document.querySelectorAll("main > section").forEach(s => io.observe(s));

/* dot-matrix text with pointer repel */
const startDots = () => {
  const c = $("dots"), x = c.getContext("2d"), W = c.width, H = c.height, gap = 9;
  const off = document.createElement("canvas"); off.width = W; off.height = H;
  const o = off.getContext("2d"), lines = SITE.ledText.split("\n").slice(0, 2);
  const size = lines.length > 1 ? 130 : 190;
  o.fillStyle = "#fff"; o.textAlign = "center"; o.textBaseline = "middle"; o.font = `700 ${size}px "Space Grotesk",Arial,sans-serif`;
  lines.forEach((l, i) => o.fillText(l.toUpperCase(), W / 2, H / 2 + (i - (lines.length - 1) / 2) * size * .95, W - 40));
  const d = o.getImageData(0, 0, W, H).data, P = [];
  for (let y = 0; y < H; y += gap) for (let xx = 0; xx < W; xx += gap) if (d[(y * W + xx) * 4 + 3] > 128) P.push({ hx: xx, hy: y, x: xx, y: y, vx: 0, vy: 0 });
  let m = { x: -999, y: -999 };
  const set = e => { const r = c.getBoundingClientRect(), t = e.touches ? e.touches[0] : e; m.x = (t.clientX - r.left) * W / r.width; m.y = (t.clientY - r.top) * H / r.height; };
  c.addEventListener("pointermove", set); c.addEventListener("pointerleave", () => m = { x: -999, y: -999 });
  const draw = () => {
    x.clearRect(0, 0, W, H);
    P.forEach(p => {
      const dx = p.x - m.x, dy = p.y - m.y, dist = Math.hypot(dx, dy);
      if (dist < 70 && !still) { const f = (70 - dist) / 70 * 6; p.vx += dx / dist * f; p.vy += dy / dist * f; }
      p.vx += (p.hx - p.x) * .06; p.vy += (p.hy - p.y) * .06; p.vx *= .82; p.vy *= .82; p.x += p.vx; p.y += p.vy;
      x.fillStyle = "#F2F3F7"; x.beginPath(); x.arc(p.x, p.y, 3, 0, 6.283); x.fill();
    });
    requestAnimationFrame(draw);
  };
  draw();
};
(document.fonts ? document.fonts.ready : Promise.resolve()).then(startDots);

/* 3D scene (three.js) – internet venum, CDN-la irundhu load aagum */
(() => {
  if (!window.THREE) return;
  const cv = $("gl"), R = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  R.setPixelRatio(Math.min(devicePixelRatio, 2));
  const S = new THREE.Scene(), C = new THREE.PerspectiveCamera(50, 1, .1, 100);
  S.add(new THREE.AmbientLight(0x707590, .8));
  const L1 = new THREE.PointLight(0xFF2E93, 3, 60); L1.position.set(-6, 3, 6);
  const L2 = new THREE.PointLight(0x00E5FF, 2.2, 60); L2.position.set(6, -3, 5);
  S.add(L1, L2);
  const G = new THREE.Group(); S.add(G);
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.9, 1), new THREE.MeshStandardMaterial({ color: 0xaab0c4, metalness: .85, roughness: .28, flatShading: true }));
  const wire = new THREE.Mesh(new THREE.IcosahedronGeometry(2.5, 2), new THREE.MeshBasicMaterial({ color: 0xFF2E93, wireframe: true, transparent: true, opacity: .28 }));
  const ring = new THREE.Mesh(new THREE.TorusGeometry(3.4, .012, 8, 160), new THREE.MeshBasicMaterial({ color: 0x00E5FF, transparent: true, opacity: .7 }));
  ring.rotation.x = 1.2;
  G.add(core, wire, ring);

  const sections = [...document.querySelectorAll("main > section")];
  const key = [[2.6, .2, 1], [-3, .3, .9], [3, 0, 1.1], [-2.8, -.2, .9], [0, 0, 1.6], [2.6, .2, 1]]; // x, y, scale per section
  let mx = 0, my = 0;
  addEventListener("pointermove", e => { mx = e.clientX / innerWidth - .5; my = e.clientY / innerHeight - .5; });
  const ease = still ? 1 : .05;
  const render = t => {
    const h = document.documentElement, p = h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight);
    let idx = 0; sections.forEach((s, i) => { if (s.getBoundingClientRect().top <= innerHeight / 2) idx = i; });
    const k = key[idx] || key[0], narrow = innerWidth < 760;
    const tx = narrow ? 0 : k[0], ty = narrow ? 1.6 : k[1], ts = narrow ? k[2] * .6 : k[2];
    G.position.x += (tx - G.position.x) * ease; G.position.y += (ty - G.position.y) * ease;
    G.scale.setScalar(G.scale.x + (ts - G.scale.x) * ease);
    G.rotation.y = p * 12 + t * .0002 + mx * .8; G.rotation.x = my * .6 + p * 2;
    wire.rotation.y = -t * .0003; ring.rotation.z = t * .0004;
    C.position.z = 9 - p * 2.5;
    R.render(S, C);
    if (!still) requestAnimationFrame(render);
  };
  const size = () => { R.setSize(innerWidth, innerHeight, false); C.aspect = innerWidth / innerHeight; C.updateProjectionMatrix(); };
  addEventListener("resize", () => { size(); if (still) render(0); });
  size();
  if (still) addEventListener("scroll", () => render(0), { passive: true });
  render(0);
})();
